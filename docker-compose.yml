services:
  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
      - "4173:4173"
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  node_modules:
